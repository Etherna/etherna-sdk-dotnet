name: Unstable release deploy to nuget.etherna.io

on:
  push:
    branches:
    - dev
    - 'release/**'

# Opt out of the usage telemetry of GitVersion, which runs at every build.
env:
  DO_NOT_TRACK: 1

jobs:
  verify-aot:
    uses: ./.github/workflows/aot-compatibility.yml

  build-test-package:
    needs: verify-aot
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Run unit tests
      run: dotnet test --configuration Release
      
    - name: Generate nuget package
      run: dotnet pack --configuration Release -o nupkg

    - name: Push packages
      run: dotnet nuget push './nupkg/*.nupkg' --api-key ${{secrets.NUGET_ETHERNA_APIKEY}} --source https://nuget.etherna.io/v3/index.json
